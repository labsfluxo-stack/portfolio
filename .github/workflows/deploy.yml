name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24 para o CI rodar a mesma major do desenvolvimento, e porque o
      # jsdom 30 pede ^22.22.2 || ^24.15.0 || >=26.0.0.
      #
      # ATENÇÃO AO LOCKFILE, que é o que já quebrou este deploy duas vezes
      # com "Missing: @emnapi/runtime@1.11.3 from lock file":
      #
      # `package-lock.json` PRECISA SER GERADO NO LINUX. O npm no Windows
      # poda `@emnapi/runtime` — dependência transitiva do
      # `@tailwindcss/oxide-wasm32-wasi` — e o lockfile sai incompleto para
      # qualquer runner Linux, que exige a entrada na validação do `npm ci`.
      # Não é versão de npm: já falhou com npm 10.9.8 e com 11.16.0, e passa
      # local com 11.6.2. É plataforma, e nenhum `npm install` rodado no
      # Windows conserta, nem com --os=linux --cpu=x64.
      #
      # Para regenerar, use o mesmo Linux do runner:
      #
      #   docker run --rm -v "$PWD:/w" -w /w node:24 \
      #     sh -c "rm -f package-lock.json && npm install --package-lock-only"
      #
      # O lockfile resultante continua servindo Windows e macOS: as 13
      # entradas win32 e 14 darwin sobrevivem, e nenhuma versão muda.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node -v && npm -v
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /portfolio
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
      - run: npm run test:html
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
