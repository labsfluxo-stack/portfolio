<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Um contêiner com o N no meio, na mesma linguagem do pátio da hero
    (components/three/Portico.tsx). Substituiu a constelação de nós, que era
    o conceito rejeitado da primeira versão da cena e tinha ficado órfã aqui.

    CUIDADO AO EDITAR ESTES COMENTÁRIOS: XML proíbe dois hifens seguidos
    dentro de um comentário. Citar um token CSS pelo nome completo, com o
    prefixo de duas hifens, torna o arquivo XML inválido e o navegador
    descarta o ícone inteiro sem avisar em lugar nenhum. Aconteceu: por isso
    os tokens abaixo aparecem sem o prefixo. E não confie em pré-visualizar
    o desenho embutido num HTML, porque o parser de HTML é tolerante e passa
    batido; só abrir o próprio arquivo .svg no navegador pega o erro.

    O CONTÊINER É FEITO DE TRAVESSAS, NÃO DE CANTONEIRAS. A primeira versão
    marcava os quatro cantos com blocos, como o pátio faz, e renderizada não
    funcionou: com a moldura em traço de 2, os blocos fundiram com ela e
    viraram entalhes no meio das arestas, lendo como moldura de quadro
    recortada. As travessas de cima e de baixo resolvem melhor, porque são a
    estrutura que o olho reconhece num contêiner e, por serem faixas cheias,
    sobrevivem à redução muito melhor que detalhe de canto, que sempre vira
    sujeira abaixo de 32px.

    DESENHADO PARA 16px, que é o tamanho em que uma aba mostra o ícone:
    travessas de 2,6 viram 1,3px e continuam sólidas; o N tem 12 de 32 de
    altura, com folga de 3 para cada travessa, então nunca encosta nelas nem
    quando tudo encolhe pela metade; a linha lateral é a única coisa que
    pode sumir a 16px sem prejuízo, porque é detalhe de 32px para cima.

    O N é PATH, nunca text. Um elemento de texto dependeria de fonte
    presente no sistema (a Geist não está disponível neste contexto) e
    cairia num fallback diferente por plataforma, cada um com métrica
    própria: o desenho sairia descentralizado em algum lugar, sem aviso.
  -->
  <rect width="32" height="32" rx="7" fill="#08090C"/>

  <!-- Chapa do contêiner. Cores só de token de app/globals.css, nunca cinza
       avulso: faint na linha lateral (é linha e não texto, o único uso
       legítimo dele) e muted nas travessas, que precisam de presença. O
       token border seria fiel ao pátio, mas é quase preto contra o fundo
       quase preto e sumiria justamente no tamanho que importa. -->
  <rect x="4.5" y="4.5" width="23" height="23" fill="#13161B" stroke="#4A505A" stroke-width="1"/>
  <rect x="4.5" y="4.5" width="23" height="2.6" fill="#878C96"/>
  <rect x="4.5" y="24.9" width="23" height="2.6" fill="#878C96"/>

  <!-- O N: duas hastes e a diagonal como paralelogramo. A diagonal nasce com
       os mesmos 3 de largura horizontal das hastes e cai para cerca de 2,4
       de espessura perpendicular por causa da inclinação, que é como um N
       bem desenhado se comporta: a diagonal é sempre um pouco mais fina que
       as verticais. -->
  <g fill="#F5F3EF">
    <rect x="10" y="10" width="3" height="12"/>
    <rect x="19" y="10" width="3" height="12"/>
    <path d="M10 10h3l9 12h-3z"/>
  </g>
</svg>
